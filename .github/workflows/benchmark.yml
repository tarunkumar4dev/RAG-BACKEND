name: tests

# Unit tests, then the question-quality benchmark gate. A benchmark regression
# must block the merge, so make the `benchmark` job a required status check in
# the repository's branch-protection settings (that part cannot be configured
# from this file).

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: test-generator-backend

env:
  # The suite must never reach a real provider or database.
  ENVIRONMENT: development
  GEMINI_MOCK: "1"
  GEMINI_API_KEY: mock
  SUPABASE_URL: https://example.supabase.co
  # STRICT_PIPELINE stays unset (false): CI covers the legacy default path, and
  # the strict-pipeline code paths are exercised directly by their unit tests.

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches runtime.txt (the Vercel deploy target).
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Backend pins first — they carry the google-genai 1.x client the code
          # uses. requirements-dev.txt is NOT used here because it pulls
          # ../api/requirements.txt, which pins google-genai==0.8.0 and would
          # downgrade that client. reportlab is imported at module scope by
          # export_service.py, so it is required even though it lives only in
          # the api requirements; pylatexenc comes from the same set.
          pip install -r requirements.txt
          pip install reportlab pylatexenc pytest

      - name: Unit tests
        run: python -m pytest tests/unit/ -v --tb=short

  benchmark:
    name: benchmark gate
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install reportlab pylatexenc pytest

      - name: Question-quality benchmark
        # Fails the job — and therefore the merge — if any paper regresses on
        # numeric correctness, exactly-one-correct-option, duplicates,
        # count/marks reconciliation, option position balance or blueprint
        # coverage.
        run: python -m pytest tests/benchmark/ -v --tb=short
